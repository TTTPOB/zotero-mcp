name: Version Check

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install project
        run: uv sync --locked

      - name: Check tag matches declared version
        shell: bash
        run: |
          set -euo pipefail
          declared_version="$(uv run python -c 'from zotero_mcp import __version__; print(__version__)')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$declared_version" ]]; then
            echo "Git tag v$tag_version does not match declared version $declared_version" >&2
            exit 1
          fi

      - name: Check lock file
        run: uv lock --check

      - name: Run tests
        run: uv run pytest -q

      - name: Build distributions
        run: uv build
