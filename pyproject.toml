[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zotero-mcp-server"
dynamic = ["version"]
description = "A small MCP server for the Zotero 10 local API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "54yyyu" }]
dependencies = [
    "pyzotero>=1.15.1,<2",
    "mcp>=1.30,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.12",
    # The one HTTP client this project uses directly, and the one pyzotero
    # itself moved to. The MCP SDK still depends on httpx and installs it
    # regardless, but no first-party module imports it: mixing the two stacks
    # is how a request ends up serialized by one library and parsed by the
    # other's response types.
    "httpx2>=2.12,<3",
]

[project.urls]
Homepage = "https://github.com/TTTPOB/zotero-mcp"
Upstream = "https://github.com/54yyyu/zotero-mcp"

[project.scripts]
zotero-mcp = "zotero_mcp.cli:main"

[tool.hatch.version]
source = "code"
path = "src/zotero_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
